name: DB9 Android ARM64 installer
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: db9-android-1.5.0
  cancel-in-progress: false
env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: r28c
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
jobs:
  generate-bridge:
    uses: ./.github/workflows/db9-bridge.yml
  build:
    needs: generate-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib g++-multilib libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config
      - name: Export cache environment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
          cache: true
      - name: Patch Flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Build native dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./flutter/build_android_deps.sh arm64-v8a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: db9-android
          key: aarch64-linux-android
          cache-on-failure: true
      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/
      - name: Configure DB9 Android package
        env:
          DB9_ANDROID_KEYSTORE: ${{ secrets.DB9_ANDROID_KEYSTORE }}
          DB9_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DB9_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/db9/prepare-android.py
      - name: Build signed APK
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name 1.5.0 --build-number 68
      - name: Verify APK and package sources
        run: |
          mkdir -p output
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/rustdesk-db9-1.5.0-aarch64.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs output/rustdesk-db9-1.5.0-aarch64.apk > output/db9-android-signature.txt
          "$BUILD_TOOLS/aapt" dump badging output/rustdesk-db9-1.5.0-aarch64.apk > output/db9-android-package.txt
          python3 tools/db9/package-android.py
      - name: Remove signing material
        if: always()
        run: rm -f flutter/android/db9-android.p12 flutter/android/key.properties
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db9-android-arm64
          path: output/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: db9-android-arm64
          path: output
      - name: Publish validated Android delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload 1.5.0-db9.1 output/*
